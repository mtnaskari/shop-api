services:
  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER:-shop}:${MONGO_PASSWORD:-shop}@mongo:27017/shop?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - '${API_PORT:-3000}:3000'

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-shop}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-shop}
    # Published on 27018 so it does not clash with a local MongoDB on 27017.
    ports:
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
